plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}
android {
    namespace 'fr.byphilou.harmonie'
    compileSdk 36
    defaultConfig {
        applicationId 'fr.byphilou.harmonie'
        minSdk 26
        targetSdk 35
        versionCode 27
        versionName '3.5.20'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets.main.jniLibs.srcDirs = ['src/main/jniLibs']
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        jniLibs { useLegacyPackaging = true }
    }
}
chaquopy {
    defaultConfig {
        version '3.14'
    }
}

// Media3 runs independently from the Activity so playback survives screen lock.
dependencies {
    // Nécessaire au MediaButtonReceiver et aux contrôleurs Bluetooth.
    implementation "androidx.core:core:1.16.0"
    implementation "androidx.media3:media3-exoplayer:1.10.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.10.1"
    implementation "androidx.media3:media3-session:1.10.1"
}

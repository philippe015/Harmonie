name: Compiler et publier l'APK Harmonie v3.5.20
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-release-apk-v3.5.20.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: harmonie-v3.5.20-apk
  cancel-in-progress: false
jobs:
  apk-arm64:
    if: github.repository == 'philippe015/Harmonie'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Sources figées v3.5.20
        uses: actions/checkout@v4
        with:
          ref: v3.5.20
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Python 3.14 pour Chaquopy
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Android SDK du runner Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager introuvable dans $ANDROID_SDK_ROOT/cmdline-tools"
            find "$ANDROID_SDK_ROOT" -maxdepth 4 -name sdkmanager -print || true
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
      - name: Installer SDK 36 et NDK 27c
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          test -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"
          test -f "$ANDROID_SDK_ROOT/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"
      - name: Rust stable ARM64 Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Cargo NDK
        run: cargo install cargo-ndk --locked
      - name: Dépendances des tests
        run: python -m pip install Pillow
      - name: Tests Python
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Tests Rust
        working-directory: rust-core
        run: cargo test --lib
      - name: Compiler Rust ARM64
        working-directory: rust-core
        run: |
          cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release
          test -s ../app/src/main/jniLibs/arm64-v8a/libharmonie_core.so
      - name: Installer Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compiler APK Android de test
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Vérifier l'APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          mkdir -p distribution
          cp "$APK" distribution/Harmonie-v3.5.20-android-arm64-debug.apk
          sha256sum distribution/*.apk | tee distribution/SHA256SUMS.txt
      - name: Conserver l'APK dans GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Harmonie-v3.5.20-android-arm64-debug
          path: distribution/
          if-no-files-found: error
          retention-days: 30
      - name: Ajouter l'APK à la Release publique
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE=v3.5.20
          if ! gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE" --repo "$GITHUB_REPOSITORY" --title "Harmonie v3.5.20 — APK de test" --notes-file CHANGELOG_V3_5_20.md --prerelease
          fi
          gh release upload "$RELEASE" distribution/Harmonie-v3.5.20-android-arm64-debug.apk distribution/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" --json url,assets
